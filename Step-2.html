<!doctype html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Aurelian Gold - Trial Details</title>
    <!-- Bootstrap 4.6 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style data-purpose="custom-styling">
      :root {
        --aurelian-gold: #d4af37;
        --obsidian-black: #0a0a0a;
        --deep-graphite: #1a1a1a;
      }

      body {
        background-color: var(--obsidian-black);
        color: #ffffff;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
      }

      /* Modal Backdrop Override */
      .modal-backdrop-custom {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(8px);
        z-index: 1040;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
      }

      /* Main Modal Container */
      .onboarding-modal {
        background-color: var(--deep-graphite);
        border: 1px solid rgba(212, 175, 55, 0.3);
        border-radius: 0.75rem;
        box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.5);
        width: 100%;
        max-width: 500px;
        position: relative;
        overflow: hidden;
      }

      .btn-close-custom {
        position: absolute;
        top: 1rem;
        right: 1rem;
        background: transparent;
        border: none;
        color: rgba(255, 255, 255, 0.5);
        font-size: 1.5rem;
        line-height: 1;
        cursor: pointer;
        transition: color 0.3s;
        z-index: 10;
      }

      .btn-close-custom:hover {
        color: var(--aurelian-gold);
      }

      /* Typography & Header */
      .modal-header-content {
        padding: 2.5rem 2rem 0 2rem;
        text-align: center;
      }

      .modal-title-custom {
        font-size: 1.75rem;
        font-weight: 700;
        letter-spacing: -0.025em;
        margin-bottom: 1.5rem;
      }

      .text-gold {
        color: var(--aurelian-gold);
      }

      /* Step Indicator */
      .step-nav {
        display: flex;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        position: relative;
        margin-bottom: 1rem;
      }

      .step-item {
        flex: 1;
        padding-bottom: 1rem;
        text-align: center;
      }

      .step-item.active {
        border-bottom: 2px solid var(--aurelian-gold);
        color: var(--aurelian-gold);
      }

      .step-item.completed {
        color: var(--aurelian-gold);
        opacity: 0.6;
      }

      .step-item.inactive {
        color: rgba(255, 255, 255, 0.3);
      }

      .step-label {
        display: block;
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }

      .step-desc {
        font-size: 0.7rem;
      }

      .active-arrow {
        position: absolute;
        bottom: -1px;
        left: 75%;
        transform: translateX(-50%);
        width: 0;
        height: 0;
        border-left: 6px solid transparent;
        border-right: 6px solid transparent;
        border-bottom: 6px solid var(--aurelian-gold);
      }

      .btn-back {
        background: none;
        border: none;
        color: rgba(255, 255, 255, 0.4);
        font-size: 0.65rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.5rem;
        transition: color 0.3s;
      }

      .btn-back:hover {
        color: var(--aurelian-gold);
      }

      /* Form Styling */
      .form-container {
        padding: 1.5rem 2rem 2.5rem;
      }

      .section-title {
        font-size: 0.7rem;
        font-weight: 700;
        text-transform: uppercase;
        color: var(--aurelian-gold);
        letter-spacing: 0.15em;
        margin-bottom: 1rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .section-title span.price-label {
        color: rgba(255, 255, 255, 0.3);
        font-weight: 400;
        letter-spacing: 0.05em;
      }

      .form-group label {
        font-size: 0.7rem;
        font-weight: 600;
        text-transform: uppercase;
        color: rgba(212, 175, 55, 0.8);
        margin-bottom: 0.25rem;
      }

      .form-control-custom {
        background-color: rgba(0, 0, 0, 0.4) !important;
        border: 1px solid rgba(255, 255, 255, 0.1) !important;
        border-radius: 0.5rem;
        color: #ffffff !important;
        padding: 0.75rem;
        transition: all 0.3s;
        font-size: 0.9rem;
      }

      .form-control-custom:focus {
        outline: none;
        box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.5);
        border-color: var(--aurelian-gold) !important;
        background-color: rgba(0, 0, 0, 0.5) !important;
      }

      /* Plan Radio Cards */
      .plan-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.75rem;
        margin-bottom: 2rem;
      }

      .plan-card {
        background-color: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 0.5rem;
        padding: 1rem 0.75rem;
        cursor: pointer;
        transition: all 0.3s;
        position: relative;
        text-align: left;
      }

      .plan-card:hover {
        border-color: rgba(212, 175, 55, 0.5);
      }

      .plan-card.selected {
        border-color: var(--aurelian-gold);
        background-color: rgba(212, 175, 55, 0.05);
      }

      .plan-name {
        display: block;
        font-size: 0.65rem;
        font-weight: 700;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.5);
        margin-bottom: 0.25rem;
      }

      .plan-price {
        display: block;
        font-size: 1.25rem;
        font-weight: 700;
        color: #ffffff;
        margin-bottom: 0.5rem;
      }

      .plan-info {
        font-size: 0.6rem;
        color: rgba(255, 255, 255, 0.4);
        line-height: 1.3;
      }

      .radio-indicator {
        position: absolute;
        bottom: 0.75rem;
        right: 0.75rem;
        width: 14px;
        height: 14px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .selected .radio-indicator {
        border-color: var(--aurelian-gold);
      }

      .radio-dot {
        width: 6px;
        height: 6px;
        background-color: var(--aurelian-gold);
        border-radius: 50%;
        display: none;
      }

      .selected .radio-dot {
        display: block;
      }

      /* Summary Card */
      .summary-box {
        background-color: rgba(0, 0, 0, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 0.5rem;
        padding: 1.25rem;
        margin-bottom: 1.5rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .summary-left .label {
        font-size: 0.6rem;
        font-weight: 700;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.4);
        display: block;
      }

      .summary-left .value {
        font-weight: 700;
        font-size: 1rem;
        color: #ffffff;
      }

      .summary-left .subtext {
        font-size: 0.65rem;
        color: rgba(255, 255, 255, 0.3);
        display: block;
      }

      .summary-right {
        text-align: right;
      }

      .summary-right .total {
        font-size: 1.5rem;
        font-weight: 800;
        color: var(--aurelian-gold);
        line-height: 1;
      }

      .summary-right .due-today {
        font-size: 0.6rem;
        color: rgba(255, 255, 255, 0.3);
        text-decoration: line-through;
        margin-top: 0.25rem;
      }

      /* Terms Section */
      .terms-check {
        display: flex;
        gap: 0.75rem;
        margin-bottom: 1.5rem;
      }

      .terms-check input {
        margin-top: 0.2rem;
      }

      .terms-label {
        font-size: 0.7rem;
        color: rgba(255, 255, 255, 0.4);
        line-height: 1.5;
      }

      .terms-link {
        color: var(--aurelian-gold);
        text-decoration: underline;
      }

      /* Submit Button */
      .btn-gold-submit {
        width: 100%;
        background-color: rgba(212, 175, 55, 0.4);
        color: #000000;
        font-weight: 900;
        padding: 1.25rem;
        border: none;
        border-radius: 0.5rem;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        cursor: not-allowed;
        opacity: 0.5;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        line-height: 1;
      }

      .btn-gold-submit.enabled {
        background-color: var(--aurelian-gold);
        opacity: 1;
        cursor: pointer;
        box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
      }

      .btn-gold-submit .btn-text {
        font-size: 1rem;
        margin-bottom: 0.25rem;
      }

      .btn-gold-submit .btn-subtext {
        font-size: 0.55rem;
        font-weight: 700;
        opacity: 0.7;
      }

      .security-footer {
        margin-top: 1.25rem;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        color: rgba(255, 255, 255, 0.2);
        font-size: 0.6rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }

      .security-footer .line {
        height: 1px;
        width: 20px;
        background: rgba(255, 255, 255, 0.1);
      }

      .autofill-btn {
        position: absolute;
        right: 0.75rem;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(16, 185, 129, 0.1);
        border: 1px solid rgba(16, 185, 129, 0.2);
        color: #10b981;
        font-size: 0.6rem;
        font-weight: 800;
        padding: 0.25rem 0.5rem;
        border-radius: 0.25rem;
        text-transform: uppercase;
        z-index: 5;
      }
    </style>
  </head>
  <body>
    <div class="modal-backdrop-custom">
      <main class="onboarding-modal" data-purpose="onboarding-modal">
        <!-- Close Button -->
        <button aria-label="Close" class="btn-close-custom">
          <svg
            fill="none"
            height="24"
            stroke="currentColor"
            viewbox="0 0 24 24"
            width="24"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M6 18L18 6M6 6l12 12"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
            ></path>
          </svg>
        </button>
        <!-- Modal Content Header -->
        <header class="modal-header-content">
          <h1 class="modal-title-custom">
            Start Your <span class="text-gold">14 Day</span> Free Trial Today!
          </h1>
          <!-- Step Indicator -->
          <nav class="step-nav">
            <!-- Step 1 Completed -->
            <div class="step-item completed">
              <span class="step-label">Step 1</span>
              <span class="step-desc">Business Details</span>
            </div>
            <!-- Step 2 Active -->
            <div class="step-item active">
              <span class="step-label">Step 2</span>
              <span class="step-desc">Trial Details</span>
              <div class="active-arrow"></div>
            </div>
          </nav>
          <button class="btn-back">
            <svg
              class="mr-1"
              fill="none"
              height="12"
              stroke="currentColor"
              viewbox="0 0 24 24"
              width="12"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M15 19l-7-7 7-7"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2.5"
              ></path>
            </svg>
            Go Back to Step 1
          </button>
        </header>
        <!-- Onboarding Form -->
        <form class="form-container" id="onboarding-form">
          <!-- Plan Selection -->
          <div class="section-title">
            Select Your Plan
            <span class="price-label">Price / Mo</span>
          </div>
          <div class="plan-grid">
            <label class="plan-card selected" id="plan-starter">
              <input
                checked=""
                class="d-none"
                name="plan"
                type="radio"
                value="starter"
              />
              <span class="plan-name">Starter</span>
              <span class="plan-price">$97</span>
              <p class="plan-info">
                14 Day Trial then $97/mo. Perfect for individuals.
              </p>
              <div class="radio-indicator">
                <div class="radio-dot"></div>
              </div>
            </label>
            <label class="plan-card" id="plan-unlimited">
              <input
                class="d-none"
                name="plan"
                type="radio"
                value="unlimited"
              />
              <span class="plan-name">Unlimited</span>
              <span class="plan-price">$297</span>
              <p class="plan-info">
                14 Day Trial then $297/mo. For growing teams.
              </p>
              <div class="radio-indicator">
                <div class="radio-dot"></div>
              </div>
            </label>
            <label class="plan-card" id="plan-pro">
              <input class="d-none" name="plan" type="radio" value="pro" />
              <span class="plan-name">Pro</span>
              <span class="plan-price">$497</span>
              <p class="plan-info">
                14 Day Trial then $497/mo. Enterprise scaling.
              </p>
              <div class="radio-indicator">
                <div class="radio-dot"></div>
              </div>
            </label>
          </div>
          <!-- Payment Details -->
          <div class="section-title">Payment Details</div>
          <div class="form-group position-relative">
            <input
              class="form-control form-control-custom"
              id="card-number"
              placeholder="Card number (XXXX XXXX XXXX XXXX)"
              required=""
              type="text"
            />
            <button class="autofill-btn" type="button">Autofill</button>
          </div>
          <div class="row no-gutters mb-4">
            <div class="col pr-2">
              <input
                class="form-control form-control-custom"
                placeholder="MM / YY"
                required=""
                type="text"
              />
            </div>
            <div class="col pl-2">
              <input
                class="form-control form-control-custom"
                placeholder="CVC"
                required=""
                type="text"
              />
            </div>
          </div>
          <!-- Order Summary -->
          <div class="summary-box">
            <div class="summary-left">
              <span class="label">Active Subscription</span>
              <div class="value" id="summary-plan-text">$97 Starter Plan</div>
              <span class="subtext">Your trial ends in 14 days</span>
            </div>
            <div class="summary-right">
              <div class="total">$0.00</div>
              <div class="due-today" id="summary-due-text">
                DUE TODAY: $97.00
              </div>
            </div>
          </div>
          <!-- Submit Section -->
          <div class="terms-check">
            <input id="terms" required="" type="checkbox" />
            <label class="terms-label" for="terms">
              I understand that after my 14-day trial, my card will be charged
              the monthly rate. By continuing, I agree to the
              <a class="terms-link" href="#">Terms of Service</a>.
            </label>
          </div>
          <button
            class="btn-gold-submit"
            disabled=""
            id="submit-btn"
            type="submit"
          >
            <span class="btn-text">Start Free Trial</span>
            <span class="btn-subtext">No commitment, cancel anytime.</span>
          </button>
          <div class="security-footer">
            <div class="line"></div>
            <span>Encrypted • Secure • Private</span>
            <div class="line"></div>
          </div>
        </form>
      </main>
    </div>
    <!-- Bootstrap JS Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script data-purpose="form-logic">
      $(document).ready(function () {
        const $form = $("#onboarding-form");
        const $submitBtn = $("#submit-btn");
        const $terms = $("#terms");
        const $cardNumber = $("#card-number");
        const $planRadios = $('input[name="plan"]');
        const $summaryPlan = $("#summary-plan-text");
        const $summaryDue = $("#summary-due-text");

        // Handle Plan Selection
        $planRadios.on("change", function () {
          $(".plan-card").removeClass("selected");
          $(this).closest(".plan-card").addClass("selected");

          let val = $(this).val();
          if (val === "starter") {
            $summaryPlan.text("$97 Starter Plan");
            $summaryDue.text("DUE TODAY: $97.00");
          } else if (val === "unlimited") {
            $summaryPlan.text("$297 Unlimited Plan");
            $summaryDue.text("DUE TODAY: $297.00");
          } else if (val === "pro") {
            $summaryPlan.text("$497 Pro Plan");
            $summaryDue.text("DUE TODAY: $497.00");
          }
        });

        // Form Validation
        const validate = () => {
          const isTermsChecked = $terms.is(":checked");
          const isCardFilled = $cardNumber.val().length >= 12;

          if (isTermsChecked && isCardFilled) {
            $submitBtn.prop("disabled", false).addClass("enabled");
          } else {
            $submitBtn.prop("disabled", true).removeClass("enabled");
          }
        };

        $terms.on("change", validate);
        $cardNumber.on("input", validate);

        $form.on("submit", function (e) {
          e.preventDefault();
          alert("Activating your 14-day free trial...");
        });
      });
    </script>
  </body>
</html>
